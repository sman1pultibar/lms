<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  
  <!-- Optimasi Kecepatan Koneksi & Preload Dokumen Utama Google Apps Script -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://drive.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="preload" href="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec" as="document">

  <!-- Konfigurasi PWA & Mobile Fullscreen (Android & iOS) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k&sz=w192">
  <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k&sz=w192">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LMS SMAN 1 PTB">

  <!-- Meta OpenGraph untuk Preview Tautan di WhatsApp / Media Sosial -->
  <meta property="og:title" content="LMS SMAN 1 Pulau Tiga Barat">
  <meta property="og:description" content="Portal Pembelajaran Digital, Presensi, Tugas, dan Ujian Online SMAN 1 Pulau Tiga Barat.">
  <meta property="og:image" content="https://drive.google.com/thumbnail?id=1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k&sz=w512">
  <meta property="og:type" content="website">

  <title>LMS SMAN 1 Pulau Tiga Barat</title>
  <style>
    /* Reset dasar, anti pull-to-refresh tidak sengaja, dan tinggi layar dinamis */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* Splash Screen / Layar Pembuka dengan Logo Sekolah */
    #loader-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #151b26 0%, #0b0f19 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.45s ease;
    }

    #loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      max-width: 90%;
    }

    .logo-wrapper {
      position: relative;
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: logoPulse 2.2s infinite ease-in-out;
    }

    /* Efek cahaya lembut di belakang logo */
    .logo-wrapper::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 170, 0.22) 0%, rgba(0, 255, 170, 0) 70%);
      z-index: -1;
    }

    .school-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.55));
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    .school-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f8fafc;
      margin-bottom: 14px;
    }

    /* Progress bar tipis minimalis di bawah logo */
    .progress-track {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #00ffaa, #00d4ff);
      border-radius: 4px;
      animation: indeterminate 1.3s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(260%); }
    }

    /* Tombol Fallback jika koneksi lambat / iframe tertahan */
    #fallback-box {
      display: none;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .fallback-text {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .btn-direct {
      display: inline-block;
      padding: 10px 20px;
      background-color: #00ffaa;
      color: #0b0f19;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-direct:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
    }

    /* Container Iframe Full-Screen dengan transisi instan */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #0b0f19;
      opacity: 0;
      transition: opacity 0.25s ease-out;
    }

    #app-frame.loaded {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Splash Screen Logo Sekolah saat aplikasi sedang dimuat -->
  <div id="loader-overlay">
    <div class="splash-container">
      <div class="logo-wrapper">
        <img 
          src="https://drive.google.com/thumbnail?id=1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k&sz=w256" 
          alt="Logo SMAN 1 Pulau Tiga Barat" 
          class="school-logo"
          onerror="this.style.display='none'"
        >
      </div>
      <div class="school-title">SMAN 1 Pulau Tiga Barat</div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      
      <div id="fallback-box">
        <div class="fallback-text">Koneksi membutuhkan waktu lebih lama?</div>
        <a id="direct-link" href="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec" target="_top" class="btn-direct">
          Buka Langsung Aplikasi
        </a>
      </div>
    </div>
  </div>

  <!-- Iframe Pembungkus Web App Google Apps Script -->
  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec"
    allow="geolocation; microphone; camera; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen="true"
    loading="eager">
  </iframe>

  <script>
    (function() {
      // Konfigurasi URL tujuan Apps Script
      var GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec';
      
      var iframeEl = document.getElementById('app-frame');
      var loaderEl = document.getElementById('loader-overlay');
      var fallbackEl = document.getElementById('fallback-box');
      var directLinkEl = document.getElementById('direct-link');

      // Meneruskan query parameter dari URL GitHub/Vercel ke iframe Apps Script
      var currentParams = window.location.search;
      if (currentParams) {
        var targetWithParams = GAS_WEB_APP_URL + currentParams;
        iframeEl.src = targetWithParams;
        directLinkEl.href = targetWithParams;
      }

      // Fungsi membuka tabir splash screen seketika
      function revealApp() {
        if (!iframeEl.classList.contains('loaded')) {
          iframeEl.classList.add('loaded');
        }
        if (!loaderEl.classList.contains('hidden')) {
          loaderEl.classList.add('hidden');
        }
      }

      // Buka langsung tanpa jeda tambahan begitu iframe selesai merender DOM awal
      iframeEl.addEventListener('load', revealApp);

      // Fail-safe Auto-Reveal: Jika aset eksternal lambat, buka tampilan utama dalam 2.8 detik
      setTimeout(revealApp, 2800);

      // Tampilkan opsi tombol buka langsung jika koneksi benar-benar terputus (> 7 detik)
      setTimeout(function() {
        fallbackEl.style.display = 'block';
      }, 7000);
    })();
  </script>
</body>
</html>
