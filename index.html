<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0284c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LMS SMAN 1 Pulau Tiga Barat">
  <title>LMS SMAN 1 Pulau Tiga Barat</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta property="og:title" content="LMS SMAN 1 Pulau Tiga Barat">
  <meta property="og:description" content="Portal Pembelajaran Digital Terpadu SMAN 1 Pulau Tiga Barat">
  <meta property="og:image" content="logo.png">
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preload" as="document" href="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f0f9ff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
    }
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8vh;
      background: linear-gradient(180deg, #e0f2fe 0%, #f8fafc 50%, #fef9c3 100%);
      transition: opacity 0.35s ease, visibility 0.35s ease;
      overflow: hidden;
    }
    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .photo-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      opacity: 0.55;
      z-index: 1;
      pointer-events: none;
    }
    .brand-card {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 12px 20px;
      margin: 0 16px;
      background: transparent;
      border: none;
      box-shadow: none;
      max-width: 440px;
      width: 92%;
    }
    .school-logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.9)) drop-shadow(0 2px 6px rgba(15, 23, 42, 0.25));
    }
    .school-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.3px;
      line-height: 1.25;
      text-shadow: 0 1px 10px rgba(255, 255, 255, 0.95), 0 0 4px rgba(255, 255, 255, 0.9);
    }
    .school-subtitle {
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #0369a1;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.95), 0 0 4px rgba(255, 255, 255, 0.9);
    }
    .fallback-box {
      display: none;
      margin-top: 14px;
    }
    .fallback-btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }
    #app-frame {
      width: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <!-- Foto Latar Belakang Kegiatan Sekolah Transparan -->
    <img src="bg-sekolah.jpg" alt="Latar Belakang SMAN 1 Pulau Tiga Barat" class="photo-bg" onerror="this.style.display='none'">

    <!-- Logo & Judul Sekolah Tanpa Kotak Putih (Posisi Atas Agar Wajah Foto Terlihat Jelas) -->
    <div class="brand-card">
      <img src="logo.png" alt="Logo SMAN 1 Pulau Tiga Barat" class="school-logo" onerror="this.style.display='none'">
      <div class="school-title">SMAN 1 Pulau Tiga Barat</div>
      <div class="school-subtitle">Portal Pembelajaran Digital Terpadu</div>
      <div class="fallback-box" id="fallback-box">
        <a href="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec" target="_top" class="fallback-btn">
          Buka Portal Secara Langsung
        </a>
      </div>
    </div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec"
    title="LMS SMAN 1 Pulau Tiga Barat"
    allow="camera *; microphone *; geolocation *; clipboard-read *; clipboard-write *; fullscreen *"
    allowfullscreen>
  </iframe>

  <script>
    (function () {
      var splash = document.getElementById('splash-screen');
      var iframe = document.getElementById('app-frame');
      var fallbackBox = document.getElementById('fallback-box');
      var isLoaded = false;

      function hideSplash() {
        if (isLoaded) return;
        isLoaded = true;
        setTimeout(function () {
          splash.classList.add('hidden');
        }, 400);
      }

      iframe.addEventListener('load', hideSplash);

      // Tampilkan tombol bantuan hanya jika koneksi sangat lambat (> 12 detik)
      setTimeout(function () {
        if (!isLoaded && fallbackBox) {
          fallbackBox.style.display = 'block';
        }
      }, 12000);

      // Registrasi Service Worker PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
