<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070D1E">
  <title>LMS SMAN 1 Pulau Tiga Barat</title>
  
  <!-- Favicon & PWA App Icons -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">

  <!-- Mobile App Standalone Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LMS SMAN 1 PTB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">

  <!-- 1. TURBO PRECONNECT & DNS-PREFETCH: Mempercepat Koneksi ke Server Google Apps Script (Hemat 400ms - 1.2s) -->
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://drive.google.com">
  <link rel="preconnect" href="https://drive.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.onesignal.com">
  <link rel="preconnect" href="https://cdn.onesignal.com" crossorigin>

  <!-- 2. HIGH PRIORITY RESOURCE PRELOADING (0 ms Render) -->
  <link rel="preload" as="image" href="logo.png" type="image/png">
  <link rel="preload" as="image" href="bg-sekolah.jpg" type="image/jpeg">

  <!-- OneSignal Web Push Notification SDK (FCM Engine) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "43e2810e-d719-4c08-83b8-6e55ded878de",
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/" }
      });
      console.log("OneSignal Vercel Root Initialized.");
    });

    // Jembatan Komunikasi Dua Arah antara LMS (Iframe) dengan Domain Utama Vercel
    window.addEventListener("message", function(event) {
      if (!event.data) return;

      // 0. Handshake Sinyal: Portal LMS Siap & Selesai Dilukis di Latar Belakang
      if (event.data.type === "LMS_PORTAL_READY") {
        portalReady = true;
        dismissSplash();
        return;
      }

      // 1. Minta Izin Notifikasi dari Tombol di dalam LMS
      if (event.data.type === "ONESIGNAL_MINTA_IZIN") {
        if (window.median && window.median.onesignal && window.median.onesignal.register) {
          window.median.onesignal.register();
          var frameM = document.getElementById("lmsFrame");
          if (frameM && frameM.contentWindow) {
            frameM.contentWindow.postMessage({ type: "ONESIGNAL_STATUS_IZIN", granted: true }, "*");
          }
          return;
        }

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            var permission = await OneSignal.Notifications.requestPermission();
            var isGranted = (permission === true || permission === "granted" || Notification.permission === "granted");
            
            var frame = document.getElementById("lmsFrame");
            if (frame && frame.contentWindow) {
              frame.contentWindow.postMessage({
                type: "ONESIGNAL_STATUS_IZIN",
                granted: isGranted
              }, "*");
            }
          } catch (eErr) {
            console.error("Error meminta izin notifikasi di Vercel:", eErr);
          }
        });
      }

      // 2. Sinkronkan Akun Pengguna (Guru / Siswa & Kelas)
      if (event.data.type === "ONESIGNAL_SINKRON_USER") {
        var u = event.data.user;
        if (!u) return;

        var cleanId = String(u.id || "").trim();
        var cleanRole = String(u.peran || "Siswa");
        var cleanKelas = String(u.kelasAtauMapel || "").trim().toUpperCase();
        var cleanNama = String(u.nama || "").trim();

        if (window.median && window.median.onesignal) {
          if (window.median.onesignal.login) window.median.onesignal.login({ externalId: cleanId });
          if (window.median.onesignal.tags && window.median.onesignal.tags.setTags) {
            window.median.onesignal.tags.setTags({
              tags: {
                app: "LMS_SMAN1",
                role: cleanRole,
                kelas: cleanKelas,
                idUser: cleanId,
                nama: cleanNama
              }
            });
          }
        }

        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.login(cleanId);
            await OneSignal.User.addTags({
              app: "LMS_SMAN1",
              role: cleanRole,
              kelas: cleanKelas,
              idUser: cleanId,
              nama: cleanNama
            });
            console.log("OneSignal Vercel: Sukses Sinkronisasi User ->", cleanRole, cleanKelas, cleanNama);
          } catch (eTag) {
            console.warn("OneSignal Tag notice:", eTag);
          }
        });
      }

      // 3. Logout Pengguna
      if (event.data.type === "ONESIGNAL_LOGOUT") {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.logout();
            console.log("OneSignal Vercel: User logged out.");
          } catch (eOut) {}
        });
      }
    });

    // Pengendali Splash Screen Cerdas: Menunggu Portal Login Siap di Belakang Layar (Anti-Blank Putih)
    var splashDismissed = false;
    var portalReady = false;
    var splashMountTime = Date.now();
    var MIN_SPLASH_TIME = 800; // Tampilkan minimal 800ms agar visual transisi halus

    function dismissSplash() {
      if (splashDismissed) return;
      var elapsed = Date.now() - splashMountTime;
      if (elapsed < MIN_SPLASH_TIME) {
        setTimeout(dismissSplash, MIN_SPLASH_TIME - elapsed);
        return;
      }
      splashDismissed = true;
      var splash = document.getElementById("portalSplash");
      if (splash) {
        splash.classList.add("hidden");
        setTimeout(function() {
          splash.style.display = "none";
        }, 450);
      }
    }

    // Dipanggil saat iframe selesai memuat berkas HTML dari Google Apps Script
    function saatIframeSelesaiLoad() {
      portalReady = true;
      // Berikan jeda 200ms agar browser selesai melukis formulir login di belakang splash screen
      setTimeout(function() {
        dismissSplash();
      }, 200);
    }

    // Indikator Progres Dinamis pada Splash Screen (Mencegah kesan blank/macet saat cold-start Apps Script)
    var stepStatuses = [
      { ms: 2200, text: "Menyiapkan Portal Akademik..." },
      { ms: 5500, text: "Memuat Formulir Masuk LMS..." },
      { ms: 9500, text: "Menyambungkan sistem, hampir siap..." }
    ];
    stepStatuses.forEach(function(s) {
      setTimeout(function() {
        if (!splashDismissed) {
          var statusEl = document.getElementById("splashStatusText");
          if (statusEl) statusEl.textContent = s.text;
        }
      }, s.ms);
    });

    // Batas Waktu Darurat (Fallback Timeout 18s) jika jaringan seluler luar biasa lambat
    setTimeout(function() {
      if (!splashDismissed) {
        dismissSplash();
      }
    }, 18000);

    window.addEventListener("DOMContentLoaded", function() {
      // Deteksi Jaringan Offline
      window.addEventListener("offline", function() {
        var statusEl = document.getElementById("splashStatusText");
        if (statusEl) statusEl.textContent = "Koneksi terputus. Menunggu jaringan...";
      });
      window.addEventListener("online", function() {
        var statusEl = document.getElementById("splashStatusText");
        if (statusEl) statusEl.textContent = "Koneksi terhubung kembali...";
      });
    });

    function reloadLMS() {
      var frame = document.getElementById("lmsFrame");
      if (frame) frame.src = frame.src;
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070D1E;
      background-image: linear-gradient(135deg, rgba(7, 13, 30, 0.88), rgba(15, 23, 42, 0.92)), url('bg-sekolah.jpg');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    
    #lmsFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: relative;
      z-index: 1;
      background-color: #070D1E;
      background-image: linear-gradient(135deg, rgba(7, 13, 30, 0.88), rgba(15, 23, 42, 0.92)), url('bg-sekolah.jpg');
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    /* Portal Splash Screen dengan Logo dan Background Sekolah */
    #portalSplash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(7, 13, 30, 0.88) 0%, rgba(15, 23, 42, 0.94) 100%), url('bg-sekolah.jpg') center/cover no-repeat;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
    }

    #portalSplash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 36px 28px;
      max-width: 90%;
      width: 360px;
      border-radius: 24px;
      background: rgba(15, 25, 50, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      animation: floatUp 0.7s ease-out;
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .splash-logo-container {
      width: 86px;
      height: 86px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), 0 0 20px rgba(14, 165, 233, 0.3);
      margin-bottom: 20px;
    }

    .splash-logo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .splash-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(14, 165, 233, 0.18);
      border: 1px solid rgba(14, 165, 233, 0.4);
      color: #38BDF8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .splash-title {
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .splash-sub {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
    }

    /* Animasi Spinner Pemuatan */
    .splash-loader {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .splash-status {
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>

  <!-- Layar Portal Splash: Menampilkan Logo & Background Sekolah -->
  <div id="portalSplash">
    <div class="splash-card">
      <div class="splash-logo-container">
        <img class="splash-logo-img" src="logo.png" alt="Logo SMAN 1 Pulau Tiga Barat">
      </div>
      <div class="splash-badge">
        Portal Akademik Resmi
      </div>
      <h1 class="splash-title">SMAN 1 PULAU TIGA BARAT</h1>
      <p class="splash-sub">Learning Management System</p>
      <div class="splash-loader"></div>
      <span class="splash-status" id="splashStatusText">Menghubungkan ke Portal...</span>
    </div>
  </div>

  <!-- Iframe Aplikasi LMS Google Apps Script (Dengan Izin Lengkap Clipboard, Kamera & Notifikasi) -->
  <iframe 
    id="lmsFrame" 
    src="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec" 
    loading="eager"
    fetchpriority="high"
    importance="high"
    allow="camera *; microphone *; geolocation *; autoplay; fullscreen *; display-capture *; clipboard-read *; clipboard-write *"
    allowfullscreen="true"
    allowtransparency="true"
    style="background-color:#070D1E;"
    onload="saatIframeSelesaiLoad()">
  </iframe>

</body>
</html>
