<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Optimasi Kecepatan Koneksi & Preload Dokumen Utama Google Apps Script -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">
  <link rel="preload" href="https://lh3.googleusercontent.com/d/1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k" as="image">
  <link rel="preload" href="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec" as="document">

  <!-- Konfigurasi PWA & Mobile Fullscreen (Android & iOS) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LMS SMAN 1 PTB">

  <!-- Meta OpenGraph untuk Preview Tautan di WhatsApp / Media Sosial -->
  <meta property="og:title" content="LMS SMAN 1 Pulau Tiga Barat">
  <meta property="og:description" content="Portal Pembelajaran Digital, Presensi, Tugas, dan Ujian Online SMAN 1 Pulau Tiga Barat.">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k">
  <meta property="og:type" content="website">

  <title>LMS SMAN 1 Pulau Tiga Barat</title>
  <style>
    /* Reset dasar, anti pull-to-refresh tidak sengaja, dan tinggi layar dinamis */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
    }

    /* Layar Pembuka Statis: Menutup penuh hingga portal siap 100% */
    #loader-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      max-width: 90%;
    }

    .logo-wrapper {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .school-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.45));
    }

    .school-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #f8fafc;
      line-height: 1.4;
    }

    /* Tombol Fallback hanya muncul jika jaringan bermasalah (> 12 detik) */
    #fallback-box {
      display: none;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .fallback-text {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .btn-direct {
      display: inline-block;
      padding: 10px 22px;
      background-color: #00ffaa;
      color: #0f172a;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
    }

    /* Container Iframe Full-Screen */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #0f172a;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Layar Pembuka Statis: Tampil utuh dari awal hingga portal selesai dimuat -->
  <div id="loader-overlay">
    <div class="splash-container">
      <div class="logo-wrapper">
        <img 
          id="school-logo-img"
          src="https://lh3.googleusercontent.com/d/1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k" 
          alt="Logo SMAN 1 Pulau Tiga Barat" 
          class="school-logo"
          onerror="this.onerror=null; this.src='https://drive.google.com/thumbnail?id=1nqJ02h0xff2v_wgAQLAGi2_6KiewIf-k&sz=w256';"
        >
      </div>
      <div class="school-title">SMAN 1 Pulau Tiga Barat</div>
      
      <div id="fallback-box">
        <div class="fallback-text">Koneksi internet melambat?</div>
        <a id="direct-link" href="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec" target="_top" class="btn-direct">
          Buka Langsung Portal
        </a>
      </div>
    </div>
  </div>

  <!-- Iframe Pembungkus Web App Google Apps Script -->
  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec"
    allow="geolocation; microphone; camera; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen="true"
    loading="eager">
  </iframe>

  <script>
    (function() {
      var GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby3rxrQtwW78ySJnAuXwWti2IUjX4LC4v81OZqsahqMLQJBNoKG4AqzlaWf7tg-DfA/exec';
      
      var iframeEl = document.getElementById('app-frame');
      var loaderEl = document.getElementById('loader-overlay');
      var fallbackEl = document.getElementById('fallback-box');
      var directLinkEl = document.getElementById('direct-link');
      var isRevealed = false;

      // Meneruskan query parameter dari URL GitHub/Vercel ke iframe Apps Script
      var currentParams = window.location.search;
      if (currentParams) {
        var targetWithParams = GAS_WEB_APP_URL + currentParams;
        iframeEl.src = targetWithParams;
        directLinkEl.href = targetWithParams;
      }

      // Buka layar pembuka HANYA setelah portal di dalam iframe selesai dimuat
      function revealPortal() {
        if (isRevealed) return;
        isRevealed = true;
        // Beri jeda 450ms setelah event load agar CSS & DOM awal di dalam iframe sudah tergambar rapi
        setTimeout(function() {
          loaderEl.classList.add('hidden');
        }, 450);
      }

      iframeEl.addEventListener('load', revealPortal);

      // Tampilkan tombol bantuan hanya jika koneksi benar-benar lambat (> 12 detik)
      setTimeout(function() {
        if (!isRevealed) {
          fallbackEl.style.display = 'block';
        }
      }, 12000);
    })();
  </script>
</body>
</html>
